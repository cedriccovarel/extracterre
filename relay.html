<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ExtracTerre — import Salesforce</title>
<style>*{box-sizing:border-box}html,body{height:100%}body{margin:0;font:13px/1.4 "IBM Plex Sans",system-ui,-apple-system,sans-serif;background:#f5f7f5;color:#18201d;display:flex;flex-direction:column}
.rl-head{display:flex;align-items:center;gap:8px;padding:9px 12px;background:#076246;color:#fff}.rl-head b{font-size:14px}.rl-head small{margin-left:auto;opacity:.75;font-size:11px}
#m{padding:14px 14px 0}#m p{margin:0 0 10px}#m b{color:#0c6748}#m a,#m button{font:inherit;font-weight:700;color:#0c6748;background:none;border:0;padding:0;cursor:pointer;text-decoration:underline}
#rlCheck{flex:1;min-height:0;display:flex;flex-direction:column;padding:10px}#rlCheck[hidden]{display:none}#rlCheck .mw-check{flex:1;min-height:0}
.rl-done{margin:14px;padding:12px;border-radius:10px;background:#e4f3e9;color:#23713b;font-weight:700}.rl-done.ignored{background:#eef0ef;color:#425149}</style><style id="rlCss"></style></head>
<body><div class="rl-head"><b>ExtracTerre</b><small>Import Salesforce</small></div><div id="m"><p>Envoi à ExtracTerre…</p></div><div id="rlCheck" hidden></div>
<script>
// v2.8.1 — relais du favori « → ExtracTerre » : transmet le texte à l'onglet ExtracTerre déjà ouvert (même site), sans fichier.
// v2.20.5 — la fenêtre reste ouverte et affiche le contrôle des données (bâtiments, colonnes, valeurs, lignes non reconnues) ;
// chaque action est renvoyée à l'onglet ExtracTerre (BroadcastChannel, même navigateur). Rien n'est stocké ni envoyé ailleurs.
(()=>{ const m=document.getElementById('m'), box=document.getElementById('rlCheck'); let text=''; try{ if(location.hash.startsWith('#sf=')) text=decodeURIComponent(location.hash.slice(4)); }catch{}
  history.replaceState(null,'',location.pathname);
  if(!text){ m.textContent='Aucun texte reçu.'; return; }
  const ch=typeof BroadcastChannel==='function'?new BroadcastChannel('extracterre-import'):null; let id='', done=false, checked=false, options='';
  const grow=()=>{ try{ if(window.outerHeight<560) window.resizeTo(Math.max(window.outerWidth,440),Math.min(screen.availHeight||760,720)); }catch{} };
  const send=()=>{ id=Math.random().toString(36).slice(2); m.innerHTML='<p>Envoi à ExtracTerre…</p>'; ch?.postMessage({type:'import',id,text,source:'Salesforce'});
    setTimeout(()=>{ if(done) return; m.innerHTML='<p>Aucun onglet ExtracTerre <b>ouvert et déverrouillé</b> n’a répondu.</p>'; const retry=document.createElement('button'); retry.textContent='Réessayer'; retry.onclick=send; const open=document.createElement('a'); open.href='index.html#sf='+encodeURIComponent(text); open.textContent='Ouvrir ExtracTerre dans un nouvel onglet'; open.onclick=e=>{ e.preventDefault(); window.open(open.href,'_blank'); window.close(); }; m.querySelector('p').append(' ',retry,document.createTextNode(' · '),open); },1500); };
  const act=(kind,ref='',value='')=>ch?.postMessage({type:'action',id,kind,ref,value});
  box.addEventListener('click',e=>{ const t=e.target.closest('button'); if(!t) return;
    if(t.hasAttribute('data-mw-apply')){ t.disabled=true; act('apply'); return; }
    if(t.hasAttribute('data-mw-cancel')){ act('cancel'); return; }
    if(t.dataset.mwIgn){ act('ign',t.dataset.mwIgn); return; }
    if(t.dataset.mwBack){ act('back',t.dataset.mwBack); return; }
    if(t.dataset.mwCol){ const li=t.closest('li'); if(li.querySelector('select')) return; const sel=document.createElement('select'); sel.innerHTML=options; sel.value=t.dataset.mwCur||''; sel.setAttribute('aria-label','Colonne ExtracTerre'); li.appendChild(sel); sel.focus();
      sel.onchange=()=>act('col',t.dataset.mwCol,sel.value); sel.onblur=()=>setTimeout(()=>sel.isConnected&&sel.remove(),150); } });
  if(ch) ch.onmessage=e=>{ const d=e.data; if(!d||d.id!==id) return;
    if(d.type==='ack'&&!done){ done=true; text='';
      if(!d.check){ m.innerHTML='<p><b>✓ Envoyé</b> à l’onglet ExtracTerre déjà ouvert : revenez-y pour vérifier puis intégrer.</p>'; setTimeout(()=>window.close(),1500); return; }
      m.innerHTML='<p><b>✓ Reçu</b> par ExtracTerre — préparation du contrôle…</p>';
      setTimeout(()=>{ if(!checked){ m.innerHTML='<p><b>✓ Envoyé</b> à l’onglet ExtracTerre : revenez-y pour vérifier puis intégrer.</p>'; } },4000); return; }
    if(d.type==='check'){ checked=true; grow(); m.hidden=true; box.hidden=false; if(d.css) document.getElementById('rlCss').textContent=d.css; if(d.options) options=d.options;
      const scroll=box.querySelector('.mw-check')?.scrollTop||0; box.innerHTML=`<section class="mw-check" aria-label="Contrôle de l’import Salesforce">${d.html}</section>`; const c=box.querySelector('.mw-check'); if(c) c.scrollTop=scroll; return; }
    if(d.type==='done'){ box.hidden=true; m.hidden=false; const ok=d.outcome==='integrated';
      m.innerHTML=`<div class="rl-done ${ok?'':'ignored'}">${ok?'✓ Données intégrées au projet dans ExtracTerre.':d.outcome==='ignored'?'Import ignoré : rien n’a été intégré.':'Contrôle terminé dans l’onglet ExtracTerre.'}</div>`; setTimeout(()=>window.close(),1800); } };
  send();
})();
</script></body></html>
